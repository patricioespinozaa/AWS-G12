[pytest]
# Pruebas del backend y de db. Las de infraestructura (infra/tests) usan aws-cdk-lib, que tiene sus propias
# dependencias: se corren con `cd infra && python -m pytest tests` (ver infra/README.md).
testpaths = tests
markers =
    datos: requiere el dataset del HLF en HLF_DATA_DIR; se salta si no está (por ejemplo, en CI)
