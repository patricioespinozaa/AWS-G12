# Despliegue manual a AWS (Actions → Deploy → Run workflow).
# Se autentica con un rol IAM por OIDC: no hay llaves de AWS guardadas en GitHub.
# Configuración del repositorio:
#   secrets.AWS_DEPLOY_ROLE_ARN   rol que confía en token.actions.githubusercontent.com para este repositorio
#   vars.AWS_REGION               por ejemplo us-east-1
name: Deploy

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno a desplegar
        type: choice
        options: [dev, demo]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.entorno }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build del frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Dependencias de CDK
        working-directory: infra
        run: pip install -r requirements.txt
      - name: cdk deploy
        working-directory: infra
        run: |
          npx --yes aws-cdk@2 deploy --all -c entorno=${{ inputs.entorno }} \
            --require-approval never --outputs-file salidas.json
      - name: URL de la app
        working-directory: infra
        run: |
          python -c "import json; s = json.load(open('salidas.json')); print('\n'.join(f'{k}: {v}' for st in s.values() for k, v in st.items()))" >> "$GITHUB_STEP_SUMMARY"
